# compose.yaml: everything PakChat runs on our Oracle server (see README.md here).
#   db    Postgres, PakChat's database (accounts, chats, messages waiting to be delivered)
#   app   the PakChat server (../server), only reachable through web
#   web   Caddy: the website, the APK, HTTPS certificates (free, from Let's Encrypt),
#         and the doors to the server (/api, /socket, ...)
#   turn  coturn: the call relay, for networks where phones can't reach each other
#   calls LiveKit: group calls pass through it (each phone sends once, it passes it on);
#         the sound and pictures are locked on the phones, so it can't see or hear them
# Settings and secrets come from .env next to this file (copy .env.example).
name: pakchat

services:
  db:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: pakchat
      POSTGRES_PASSWORD: ${DB_PASSWORD:?put DB_PASSWORD in deploy/.env}
      POSTGRES_DB: pakchat
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pakchat"]
      interval: 5s
      retries: 20

  app:
    build: ../server
    image: pakchat-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ecto://pakchat:${DB_PASSWORD}@db/pakchat
      PHX_HOST: ${PAKCHAT_DOMAIN:?put PAKCHAT_DOMAIN in deploy/.env}
      PORT: "4000"
      FILES_DIR: /data/files
      # The call relay (turn, below), handed to phones with a password that lasts a day.
      TURN_URLS: turn:${PAKCHAT_DOMAIN}:3478?transport=udp,turn:${PAKCHAT_DOMAIN}:3478?transport=tcp
      # Group calls (calls, below): where phones find it. The key and secret come from .env.
      LIVEKIT_URL: wss://${PAKCHAT_DOMAIN}
    volumes:
      - files:/data
      # Firebase's key for push alerts (FCM_SERVICE_ACCOUNT=/secrets/firebase.json). Never in git.
      - ./secrets:/secrets:ro
    # Every connected phone holds one open connection, and each one uses a "file
    # handle". Docker's default allows only 1,024, so at about 1,000 people new
    # connections (and the health check) silently waited and the server looked
    # down (load test, 1 Nov). This allows 100,000.
    ulimits:
      nofile:
        soft: 100000
        hard: 100000

  web:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PAKCHAT_DOMAIN: ${PAKCHAT_DOMAIN}
    # The group call server (calls, below) is on the server itself, not in Docker's network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The website (web/dist) plus pakchat.apk and pakchat-apk.json: see build-site.sh.
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    # The front door holds two connections per phone (the phone's, and its own to the app).
    ulimits:
      nofile:
        soft: 200000
        hard: 200000

  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    # The relay needs the server's own ports for the calls it passes on.
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      # Each call through the relay uses a port or two from this range: 2,000 ports is
      # about 1,000 calls at once (it was 41, about 20 calls, until 1 Nov). The same range
      # is open in the server's firewall (setup.sh) and Oracle's security list (README.md).
      - --min-port=49160
      - --max-port=51159
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?put TURN_SECRET in deploy/.env}
      - --realm=${PAKCHAT_DOMAIN}
      # Oracle gives the server a private address, with the public one in front of it.
      - --external-ip=${PUBLIC_IP:?put PUBLIC_IP in deploy/.env}/${PRIVATE_IP:?put PRIVATE_IP in deploy/.env}
      - --fingerprint
      - --no-tls
      - --no-dtls
      - --no-cli
      - --no-multicast-peers
      # Only to phones on the internet: never into the server's own network.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      # ... and the same for IPv6 (the server itself, private and link-local addresses).
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
      - --user-quota=12
      - --total-quota=2000
      - --log-file=stdout
      - --simple-log

  calls:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    # Like the relay, it needs the server's own ports: UDP 7882 (and TCP 7881 for networks
    # that block UDP) for the calls, 7880 for setting them up (only through Caddy, at /rtc).
    network_mode: host
    environment:
      # "key: secret". Phones get a pass for one call from the PakChat server (CallController).
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?put LIVEKIT_API_KEY in deploy/.env}: ${LIVEKIT_API_SECRET:?put LIVEKIT_API_SECRET in deploy/.env}"
    command: ["--config", "/livekit.yaml", "--node-ip", "${PUBLIC_IP}"]
    volumes:
      - ./livekit.yaml:/livekit.yaml:ro

volumes:
  db:
  files:
  caddy_data:
  caddy_config:
