# Signal's own encryption library (libsignal), built for web browsers as
# WebAssembly. This is the same Rust code that runs inside the phone app, so
# the website and the phone speak exactly the same locked language.
#
# You don't need Rust to use it: the built files are in ../src/web/wasm.
# To rebuild them, see README.md in this folder.
[package]
name = "pakchat-signal-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.1" }
wasm-bindgen = "=0.2.126"
rand = "0.9"
uuid = "1.5"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
async-trait = "0.1"
# Browsers give us random numbers through crypto.getRandomValues. These lines
# tell each version of the "getrandom" helper to use it.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
