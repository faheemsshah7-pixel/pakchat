# One phone: Graphite look, a green accent (Settings › Chats › Theme), then Urdu (every screen right to left), and back.
# Settings opens from the chat list's ⋮ menu (the bottom bar has Communities now).
appId: com.pakchat.app
---
- runFlow:
    when:
      notVisible:
        id: tab-index
    commands:
      - back
- runFlow:
    when:
      notVisible:
        id: tab-index
    commands:
      - back
- tapOn:
    id: tab-index
- tapOn:
    id: chats-menu
- tapOn:
    id: menu-settings
- tapOn:
    id: open-chats-settings
- tapOn:
    id: mode-graphite
- tapOn:
    id: accent-green
- tapOn:
    id: back
- tapOn:
    id: open-language
- tapOn:
    id: lang-ur
- assertVisible: زبان
- tapOn:
    id: back
- assertVisible: سیٹنگز
- tapOn:
    id: back
- assertVisible: پاک چیٹ
- tapOn:
    id: chats-menu
- tapOn:
    id: menu-settings
- tapOn:
    id: open-language
- tapOn:
    id: lang-en
- tapOn:
    id: back
- tapOn:
    id: open-chats-settings
- tapOn:
    id: mode-sky
- tapOn:
    id: accent-blue
- tapOn:
    id: back
- assertVisible: Settings
- tapOn:
    id: back
