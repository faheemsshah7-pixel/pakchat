# In an open chat: sends three messages one after another.
appId: com.pakchat.app
---
- tapOn:
    id: composer
- inputText: Library at 4pm then
- tapOn:
    id: send
- tapOn:
    id: composer
- inputText: Bring chapter 3
- tapOn:
    id: send
- tapOn:
    id: composer
- inputText: Don't be late
- tapOn:
    id: send
- extendedWaitUntil:
    visible: Don't be late
    timeout: 10000
