# Starts a chat with OTHER (their test address) and sends TEXT.
appId: com.pakchat.app
---
- tapOn:
    id: new-chat
- extendedWaitUntil:
    visible:
      id: find-field
    timeout: 20000
- tapOn:
    id: find-field
- inputText: ${OTHER}@test.pakchat
# Enter on the keyboard is the same as tapping Find (and never hidden by the keyboard).
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: found-person
    timeout: 20000
- tapOn:
    id: found-person
- extendedWaitUntil:
    visible:
      id: composer
    timeout: 20000
- tapOn:
    id: composer
- inputText: ${TEXT}
- tapOn:
    id: send
- extendedWaitUntil:
    visible: ${TEXT}
    timeout: 10000
