<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260" fill="none" stroke="black" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- The chat background pattern: little drawings that repeat like wallpaper. -->
  <!-- crescent and star -->
  <g transform="translate(22 20)">
    <path d="M22 4a14 14 0 1 0 12 21A11 11 0 1 1 22 4z" />
    <path d="M33 7l1.5 3 3.3.4-2.4 2.3.6 3.3-3-1.6-3 1.6.6-3.3-2.4-2.3 3.3-.4z" />
  </g>
  <!-- chat bubble -->
  <g transform="translate(106 22) rotate(-5 21 20)">
    <path d="M6 4h30a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6H18l-8 7v-7H6a6 6 0 0 1-6-6V10a6 6 0 0 1 6-6z" />
    <path d="M10 14h22M10 21h14" />
  </g>
  <!-- heart -->
  <g transform="translate(196 52) rotate(-14 16 16)">
    <path d="M16 28S2 19.5 2 10.5A7 7 0 0 1 16 7a7 7 0 0 1 14 3.5C30 19.5 16 28 16 28z" />
  </g>
  <!-- music note -->
  <g transform="translate(44 92) rotate(8 16 16)">
    <path d="M10 30V6l18-4v22" />
    <circle cx="6" cy="30" r="4" />
    <circle cx="24" cy="26" r="4" />
  </g>
  <!-- camera -->
  <g transform="translate(122 104) rotate(9 20 20)">
    <path d="M24 6h-9l-4 5H5a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h30a3 3 0 0 0 3-3V14a3 3 0 0 0-3-3h-7z" />
    <circle cx="20" cy="21" r="6" />
  </g>
  <!-- sparkle -->
  <g transform="translate(206 120)">
    <path d="M12 0c1 7 4 10 12 12-8 2-11 5-12 12-1-7-4-10-12-12 8-2 11-5 12-12z" />
  </g>
  <!-- paper plane -->
  <g transform="translate(24 172) rotate(-10 20 20)">
    <path d="M2 16 38 2 28 36l-9-12z" />
    <path d="M19 24 38 2" />
  </g>
  <!-- cup of chai -->
  <g transform="translate(112 176)">
    <path d="M4 12h26v10a10 10 0 0 1-10 10h-6A10 10 0 0 1 4 22z" />
    <path d="M30 15h3a5 5 0 0 1 0 10h-4" />
    <path d="M12 2c-2 3 2 4 0 7M20 2c-2 3 2 4 0 7" />
  </g>
  <!-- kite, like at Basant -->
  <g transform="translate(196 180) rotate(12 16 30)">
    <path d="M16 2 30 18 16 40 2 18z" />
    <path d="M2 18h28M16 2v38" />
    <path d="M16 40c3 5-3 7 0 12s-2 6 0 8" />
  </g>
  <!-- dots -->
  <circle cx="90" cy="70" r="2" />
  <circle cx="175" cy="20" r="1.5" />
  <circle cx="90" cy="150" r="1.5" />
  <circle cx="170" cy="160" r="2" />
  <circle cx="80" cy="235" r="2" />
  <circle cx="240" cy="100" r="1.5" />
</svg>
